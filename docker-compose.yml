# Local Postgres for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: siletry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - siletry-pg:/var/lib/postgresql/data
volumes:
  siletry-pg:
