spring.application.name=siletry

# Railway injects PORT; locally defaults to 8080
server.port=${PORT:8080}

# ---------- Database ----------
# Railway's Postgres plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD.
# Reference them from your service's Variables tab (e.g. PGHOST=${{Postgres.PGHOST}}).
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:siletry}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Hibernate creates/updates tables itself. Switch to Flyway before real clinic data goes in.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# ---------- Siletry ----------
# Long random string in production (at least 32 characters)
siletry.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-at-least-32-chars}
siletry.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}

# Comma-separated list of frontend origins
siletry.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- WhatsApp (Meta Cloud API) ----------
# Clinics connect their own number in Setup → WhatsApp (details stored encrypted).
# Clinics without it, and everything in the simulator, are mocked.
siletry.meta.graph-version=${META_GRAPH_VERSION:v22.0}
# Same verify token in every Meta app's webhook settings. Webhook URL: https://<backend>/api/webhooks/meta
siletry.meta.verify-token=${META_VERIFY_TOKEN:}
# App secret of YOUR Meta app (App settings → Basic). Pilot clinics' app secrets are stored per clinic.
siletry.meta.app-secret=${META_APP_SECRET:}
# Siletry's own number: login codes, doctor alerts, NEXT / LATE commands. Leave empty to mock.
siletry.meta.admin-phone-number-id=${META_ADMIN_PHONE_NUMBER_ID:}
siletry.meta.admin-access-token=${META_ADMIN_ACCESS_TOKEN:}
siletry.meta.admin-display-number=${META_ADMIN_DISPLAY_NUMBER:}

# Encrypts stored WhatsApp tokens. Set once to a long random string and never change it.
siletry.credentials-key=${CREDENTIALS_KEY:dev-only-change-me-credentials-key}

# Simulator, test-mode connect, on-screen login codes. MUST be false once real clinics use the app.
siletry.dev-tools=${DEV_TOOLS:false}
siletry.dev-webhook-secret=${DEV_WEBHOOK_SECRET:dev-webhook-secret}

# Creates "Nandini Clinic" with demo data on first boot if the DB is empty
siletry.seed-demo=${SEED_DEMO:true}

# Default monthly cap of business-initiated (template) messages per clinic
siletry.default-message-cap=${DEFAULT_MESSAGE_CAP:1500}

management.endpoints.web.exposure.include=health
